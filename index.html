/* ===== Downtown Studios (manual de marca v4) · variante A =====
   c1/c2 = the brand pair. WORK (Oficina): c1 lila, c2 damasco. LIVE (Loft): the pair swaps. White always stays white,
   and text sitting on white stays lila (damasco on white is never used for text). */
:root{--lila:#482783;--damasco:#FFAA78;--ds-ease:cubic-bezier(.4,0,.2,1);--ds-ms:400ms;
  --c1:#482783;--c2:#FFAA78;--c1-tx:#fff;--c2-tx:#222329;--c2-a:rgba(255,170,120,.16);--c2-a2:rgba(255,170,120,.28);--c1-soft:#E4DEF0;--c1-a:rgba(72,39,131,.1);
  --anton:"Anton","Arial Narrow",sans-serif;--display:"Inter",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;
  --bg:var(--c1);--wood:var(--c1);--ds-mode-bg:var(--c1);--ds-mode-fg:var(--c2);
  --pbg:#fff;--front:var(--c2);--back:var(--c1-soft);--ptx:#222329;--pmut:#5C5B66;--pchip:#F3F1F7;--pline:#ECEAF0}
html[data-mode="live"]{--c1:#FFAA78;--c2:#482783;--c1-tx:#482783;--c2-tx:#fff;--c2-a:rgba(72,39,131,.14);--c2-a2:rgba(72,39,131,.24);--c1-soft:#FFE4D3;--c1-a:rgba(255,170,120,.3)}
@media (prefers-reduced-motion:reduce){:root{--ds-ms:0ms}}
body{font-family:var(--body)}
.head,.icon,.floor,.u,.act,.tag,.wname,.wdeco,#areas .tot,#entering,.brand span{transition:background-color var(--ds-ms) var(--ds-ease),color var(--ds-ms) var(--ds-ease)}
/* loading: the O of STUDIOS is the progress bar. It starts LIVE (damasco, rombo left), the rombo travels right with the load,
   and when everything is in the capsule closes back to its real size and the screen turns WORK (lila) */
.status{background:var(--damasco);transition:background-color var(--ds-ms) var(--ds-ease),opacity .7s ease}
.status.dl-work{background:var(--lila)}
.introtxt{gap:26px}

.icon:focus-visible,.floor:focus-visible,.u:focus-visible,.act:focus-visible,.ds-switch:focus-visible,.ds-empty:focus-visible{outline:3px solid var(--lila);outline-offset:2px}
